# Expected results (checked by tests/test_examples_e2e.py and scripts/run_experiments.py)
verify: COUNTEREXAMPLE_FOUND   # shipped loop stops one element early (i + 1 < n)
run: PROVED                    # mock repair round 1 iterates over the whole array (i < n)
detected_by: [cbmc, frama-c-wp]
notes: >
  V2 contract violation.  The shipped find_first never examines a[n-1], violating the ACSL post-condition
  of behavior found (\result == 1) whenever the key occurs only in the last element.  The trusted tests
  miss it (no test puts the key last) and so does the static analyzer; CBMC finds a counterexample for the
  harness assertion that mirrors the contract (e.g. n = 1, a[0] == key), and Frama-C/WP leaves the same
  post-condition unproved (no prover refutes the goal here, so WP stays INCONCLUSIVE; a refuted goal would be a wp FAIL, COUNTEREXAMPLE_FOUND).  The worst
  status wins: COUNTEREXAMPLE_FOUND.  Mock repair round 1 changes the bound to i < n (the loop invariants
  stay as they are) => CBMC passes and WP proves every goal including termination => PROVED.
