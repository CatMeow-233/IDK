# Lean C specification: variant of spec.yaml with the corrected (non-vacuous) harness.
leanc_spec: 1
spec_id: vacuous-harness-fixed
version: 1
title: Array read with corrected harness assumptions
requirement: |
  實作一個安全的整數陣列讀取函式。當索引超出範圍時，必須回傳錯誤，而不是讀取非法記憶體。
  (Implement a safe integer-array read. Out-of-range indices must return an error
  instead of reading invalid memory.)
language: {name: c, standard: c17}
target:
  function: array_read
  signature: "int array_read(const int *arr, size_t len, size_t idx, int *out)"
  params:
    - {name: arr, type: "const int *", description: "array of len readable ints, or NULL"}
    - {name: len, type: size_t, description: "number of elements in arr"}
    - {name: idx, type: size_t, description: "index to read (any value)"}
    - {name: out, type: "int *", description: "where the element is written, or NULL"}
  returns:
    type: int
    description: status code
    values:
      - {value: "ARRAY_READ_OK (0)", meaning: "success, *out == arr[idx]"}
      - {value: "ARRAY_READ_ERR_NULL (-1)", meaning: "arr or out is NULL; nothing dereferenced"}
      - {value: "ARRAY_READ_ERR_RANGE (-2)", meaning: "idx >= len; no memory read, *out untouched"}
contract:
  preconditions:
    - {id: PRE1, text: "if arr != NULL then arr points to at least len readable ints", c_expr: "len <= MAX_LEN"}
  postconditions:
    - {id: POST1, text: "arr, out non-NULL and idx < len => returns 0 and *out == arr[idx]"}
    - {id: POST2, text: "idx >= len => returns -2 and *out is unchanged"}
    - {id: POST3, text: "arr == NULL or out == NULL => returns -1"}
    - {id: POST4, text: "the return value is always one of 0, -1, -2"}
  safety:
    - {id: SAFE1, text: "no out-of-bounds memory access", checks: [bounds, pointer]}
    - {id: SAFE2, text: "no NULL dereference", checks: [pointer]}
  frame:
    - "arr[0..len) is never modified"
sources:
  editable: [src/array_read.c]
  headers: [include/array_read.h]
  include_dirs: [include]
compile:
  flags: [-Wall, -Wextra, -Wpedantic]
  warnings_policy: report
verification:
  harness: harness/array_read_harness_fixed.c
  checks: [unsigned-overflow, conversion]
  unwind: 5
  input_bounds:
    - {name: len, min: "0", max: "4", note: "array sizes up to MAX_LEN=4 are explored"}
    - {name: idx, note: "unconstrained (full size_t range)"}
  vacuity_check: true
  timeout_s: 120
# Only the formal gate (plus compilation): this example isolates what CBMC alone
# would conclude.  (The trusted tests / sanitizers would catch the bug.)
gates: [compile, cbmc]
repair:
  max_rounds: 5
