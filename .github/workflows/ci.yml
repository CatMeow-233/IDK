name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev llvm-18 cbmc bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor;
          # allow them so bubblewrap can sandbox untrusted test programs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Cache opam (Frama-C/WP)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-frama-c-33-${{ runner.os }}
      - name: Install V2 tools (Frama-C/WP, provers, Lean 4)
        run: |
          sudo apt-get install -y opam libgmp-dev zlib1g-dev pkg-config m4 z3 cvc5 zstd
          if [ ! -x ~/.opam/leanc/bin/frama-c ]; then
            opam init --bare --disable-sandboxing -n -y
            opam switch create leanc ocaml-base-compiler.4.14.2 -y
            opam install --switch=leanc -y alt-ergo frama-c
          fi
          echo "LEANC_FRAMAC=$HOME/.opam/leanc/bin/frama-c" >> "$GITHUB_ENV"
          mkdir -p "$HOME/lean"
          curl -sSfL https://releases.lean-lang.org/lean4/v4.35.0/lean-4.35.0-linux.tar.zst | tar --zstd -x -C "$HOME/lean"
          echo "LEANC_LEAN=$HOME/lean/lean-4.35.0-linux/bin/lean" >> "$GITHUB_ENV"
      - name: Install Lean C
        run: pip install -e ".[dev]"
      - name: leanc doctor
        run: leanc doctor
      - name: Unit + integration tests
        run: python -m pytest -q -ra
      - name: Reproducible experiments
        run: python scripts/run_experiments.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-results
          path: experiments/results/
